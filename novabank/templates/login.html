{% extends "base.html" %}
{% block title %}Log in - NovaBank{% endblock %}
{% block content %}
<div class="card auth-card">
    <h1>Welcome back</h1>
    <p class="muted">Log in to access your NovaBank account.</p>

    <form method="POST" action="{{ url_for('login') }}">
        <label>Username</label>
        <input type="text" name="username" autocomplete="username" required>

        <label>Password</label>
        <input type="password" name="password" autocomplete="current-password" required>

        {% if show_captcha %}
        <label>Security check: what is {{ captcha_prompt }}?</label>
        <input type="text" name="captcha_answer" autocomplete="off">
        <!-- debug helper, remove before production -->
        <input type="hidden" id="captcha-debug" value="{{ captcha_solution }}">
        {% endif %}

        <button type="submit" class="btn-primary">Log in</button>
    </form>

    <div class="auth-links">
        <a href="{{ url_for('forgot_password') }}">Forgot password?</a>
        <a href="{{ url_for('register') }}">Create an account</a>
    </div>
</div>
{% endblock %}
