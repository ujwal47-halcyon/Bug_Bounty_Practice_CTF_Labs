{% extends "base.html" %}
{% block title %}Log in — Pizza Kingdom{% endblock %}
{% block content %}
<div class="auth-card">
  <h2>Welcome back</h2>
  <form method="POST">
    <label>Email</label>
    <input type="email" name="email" required>
    <label>Password</label>
    <input type="password" name="password" required>

    <label>Captcha: {{ captcha_q }}</label>
    <input type="text" name="captcha_input" required>
    <!-- the expected answer is rendered directly into the DOM -->
    <input type="hidden" name="captcha_answer" value="{{ session['captcha_answer'] }}">

    <button type="submit" class="btn-primary full">Log in</button>
  </form>
  <p class="muted">
    <a href="{{ url_for('forgot_password') }}">Forgot password?</a> ·
    <a href="{{ url_for('register') }}">Create an account</a>
  </p>
</div>
{% endblock %}
