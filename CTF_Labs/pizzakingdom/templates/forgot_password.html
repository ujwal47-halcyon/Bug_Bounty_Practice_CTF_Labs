{% extends "base.html" %}
{% block title %}Forgot password — Pizza Kingdom{% endblock %}
{% block content %}
<div class="auth-card">
  <h2>Reset your password</h2>
  <form method="POST">
    <label>Account email</label>
    <input type="email" name="email" required>

    <label>Send reset link to (optional)</label>
    <input type="email" name="notify_email" placeholder="leave blank to use account email">

    <button type="submit" class="btn-primary full">Send reset link</button>
  </form>
</div>
{% endblock %}
