{% extends "base.html" %}
{% block title %}Set new password — Pizza Kingdom{% endblock %}
{% block content %}
<div class="auth-card">
  <h2>Choose a new password</h2>
  <form method="POST">
    <label>New password</label>
    <input type="password" name="password" required>
    <button type="submit" class="btn-primary full">Reset password</button>
  </form>
  <p class="muted">Token: {{ token }}</p>
</div>
{% endblock %}
