{% extends "base.html" %}
{% block title %}My Orders — Pizza Kingdom{% endblock %}
{% block content %}
<h2>My Orders</h2>
<div class="order-list">
  {% for o in orders %}
  <a class="order-row" href="{{ url_for('order_detail', order_id=o['id']) }}">
    <span>#{{ o['id'] }}</span>
    <span>{{ o['items'] }}</span>
    <span>₹{{ o['total'] }}</span>
    <span class="status">{{ o['status'] }}</span>
  </a>
  {% else %}
  <p class="muted">No orders yet — go get a pizza.</p>
  {% endfor %}
</div>
{% endblock %}
