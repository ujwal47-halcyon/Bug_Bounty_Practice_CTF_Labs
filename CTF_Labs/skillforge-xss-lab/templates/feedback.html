{% extends "base.html" %}

{% block title %}Send Feedback - SkillForge{% endblock %}

{% block extra_styles %}
<style>
    .feedback-hero {
        background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
        padding: 3rem 2rem;
        text-align: center;
        color: white;
    }

    .feedback-hero h1 {
        font-size: 3rem;
        font-weight: 900;
        margin-bottom: 1rem;
    }

    .feedback-form {
        background: white;
        border-radius: 16px;
        padding: 2.5rem;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        max-width: 800px;
        margin: 3rem auto;
        border: 1px solid var(--border);
    }

    .feedback-form h2 {
        font-size: 2rem;
        margin-bottom: 2rem;
        color: var(--dark);
    }

    .form-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 1.5rem;
    }

    @media (max-width: 768px) {
        .feedback-hero h1 {
            font-size: 2rem;
        }

        .form-row {
            grid-template-columns: 1fr;
        }
    }
</style>
{% endblock %}

{% block content %}
<div class="feedback-hero">
    <h1>We Value Your Feedback</h1>
    <p>Help us improve SkillForge by sharing your thoughts and suggestions</p>
</div>

<div class="container">
    <div class="feedback-form">
        <h2>Send Us Your Feedback</h2>
        <form method="POST" action="/feedback/submit">
            <div class="form-row">
                <div class="form-group">
                    <label>Your Name *</label>
                    <input type="text" name="name" class="form-control" required>
                </div>
                <div class="form-group">
                    <label>Email Address *</label>
                    <input type="email" name="email" class="form-control" required>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Feedback Type *</label>
                    <select name="feedback_type" class="form-control" required>
                        <option value="">Select type</option>
                        <option value="Feature Request">Feature Request</option>
                        <option value="Bug Report">Bug Report</option>
                        <option value="General Feedback">General Feedback</option>
                        <option value="Course Suggestion">Course Suggestion</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Subject *</label>
                    <input type="text" name="subject" class="form-control" placeholder="Brief summary" required>
                </div>
            </div>

            <div class="form-group">
                <label>Your Message *</label>
                <textarea name="message" class="form-control" rows="8" placeholder="Tell us more about your feedback..." required></textarea>
            </div>

            <button type="submit" class="btn-primary">Submit Feedback</button>
        </form>
    </div>
</div>
{% endblock %}
