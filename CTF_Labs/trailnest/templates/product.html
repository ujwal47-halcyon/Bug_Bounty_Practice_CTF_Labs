{% extends "base.html" %}
{% block title %}{{ p.name }} — TrailNest Gear{% endblock %}
{% block content %}
<section class="block wrap">
  <div class="product-hero">
    <div class="thumb-lg"></div>
    <div>
      <h1 style="font-family:var(--font-display); font-size:30px; margin:0 0 10px;">{{ p.name }}</h1>
      <p style="color:var(--slate); font-size:15px;">{{ p.desc }}</p>
      <p class="price" style="font-size:22px;">${{ "%.2f"|format(p.price) }}</p>
      <button class="btn">Add to pack</button>

      {% if referer %}
      <p class="referer-note">You arrived here from: {{ referer | safe }}</p>
      {% endif %}

      <!-- DOM-based XSS: "recently viewed" widget trusts location.hash -->
      <div id="recently-viewed" class="recently-viewed"></div>
    </div>
  </div>
</section>

<script>
  // Renders "#some-note" from the URL fragment straight into the page.
  // e.g. /product/{{ pid }}#<img src=x onerror=alert(document.domain)>
  (function () {
    var hash = decodeURIComponent(window.location.hash.slice(1));
    if (hash) {
      document.getElementById('recently-viewed').innerHTML =
        'Note from your last visit: ' + hash;
    }
  })();
</script>
{% endblock %}
