{% extends "base.html" %}
{% block title %}Redirecting… — TrailNest Gear{% endblock %}
{% block content %}
<section class="block wrap">
  <div class="panel" style="text-align:center;">
    <h1 style="font-size:20px;">Taking you to your destination</h1>
    <p style="color:var(--slate);">You're being redirected to: {{ next_url | safe }}</p>
    <a class="btn ghost" href="{{ next_url | safe }}">Continue manually</a>
  </div>
</section>

<meta http-equiv="refresh" content="4;url={{ next_url | safe }}">
{% endblock %}
