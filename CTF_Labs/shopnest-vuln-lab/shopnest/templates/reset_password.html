{% extends "base.html" %}
{% block content %}
<div class="card auth-card p-4 shadow-sm">
  <h4 class="mb-3">Reset password</h4>
  {% if error %}<div class="alert alert-danger py-2">{{ error }}</div>{% endif %}
  <form method="post">
    <input type="hidden" name="username" value="{{ username }}">
    <input type="hidden" name="token" value="{{ token }}">
    <div class="mb-3"><label class="form-label">New password</label><input class="form-control" type="password" name="password" required></div>
    <button class="btn btn-shopnest w-100" {% if error %}disabled{% endif %}>Reset password</button>
  </form>
</div>
{% endblock %}
