{% extends "base.html" %}
{% block content %}
<h4 class="mb-3">Your Orders</h4>
{% if orders %}
<table class="table bg-white shadow-sm rounded">
  <thead><tr><th>Order #</th><th>Product</th><th>Qty</th><th>Status</th><th></th></tr></thead>
  <tbody>
  {% for o in orders %}
    <tr>
      <td>#{{ o['id'] }}</td><td>{{ o['name'] }}</td><td>{{ o['qty'] }}</td><td><span class="badge bg-info">{{ o['status'] }}</span></td>
      <td><a href="{{ url_for('view_order', oid=o['id']) }}" class="btn btn-sm btn-outline-secondary">View</a></td>
    </tr>
  {% endfor %}
  </tbody>
</table>
{% else %}
<p class="text-muted">No orders yet — <a href="{{ url_for('index') }}">start shopping</a>.</p>
{% endif %}
{% endblock %}
