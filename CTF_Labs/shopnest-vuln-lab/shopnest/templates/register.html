{% extends "base.html" %}
{% block content %}
<div class="card auth-card p-4 shadow-sm">
  <h4 class="mb-3">Create your ShopNest account</h4>
  {% if error %}<div class="alert alert-danger py-2">{{ error }}</div>{% endif %}
  <form method="post">
    <div class="mb-3"><label class="form-label">Username</label><input class="form-control" name="username" required></div>
    <div class="mb-3"><label class="form-label">Email</label><input class="form-control" type="email" name="email" required></div>
    <div class="mb-3"><label class="form-label">Password</label><input class="form-control" type="password" name="password" required></div>
    <button class="btn btn-shopnest w-100">Sign up</button>
  </form>
  <div class="text-center mt-3 small"><a href="{{ url_for('login') }}">Already have an account? Log in</a></div>
</div>
{% endblock %}
