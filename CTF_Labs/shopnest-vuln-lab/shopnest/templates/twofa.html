{% extends "base.html" %}
{% block content %}
<div class="card auth-card p-4 shadow-sm">
  <h4 class="mb-1">Two-factor verification</h4>
  <p class="text-muted small">Enter the 4-digit code sent to the email for <strong>{{ username }}</strong>.</p>
  {% if error %}<div class="alert alert-danger py-2">{{ error }}</div>{% endif %}
  <form method="post">
    <div class="mb-3">
      <input class="form-control text-center fs-3" style="letter-spacing:8px" name="code" maxlength="4" pattern="[0-9]{4}" required>
    </div>
    <button class="btn btn-shopnest w-100">Verify</button>
  </form>
  <button class="btn btn-link btn-sm mt-2" onclick="resend()">Resend code</button>
  <div id="resendMsg" class="small text-success"></div>
</div>
<script>
function resend(){
  fetch("{{ url_for('send_otp') }}", {
    method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({username: "{{ username }}"})
  }).then(r=>r.json()).then(d=>{
    document.getElementById('resendMsg').innerText = d.message;
    // NOTE: d.debug_otp is also present in this response — check Network tab.
  });
}
</script>
{% endblock %}
