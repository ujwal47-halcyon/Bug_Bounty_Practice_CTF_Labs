{% extends "base.html" %}
{% block content %}
<section class="wrap">
  <div class="panel">
    <h1>Two-factor authentication</h1>
    <p class="sub">Enter the 6-digit code from your authenticator app.</p>
    {% if error %}<div class="error-banner">{{ error }}</div>{% endif %}
    <form method="post">
      <div class="field">
        <label for="code">Authentication code</label>
        <input type="text" name="code" id="code" maxlength="6" placeholder="000000" required>
      </div>
      <button class="btn" type="submit">Verify &amp; continue</button>
    </form>
    <p class="fine-print">Tip: this step confirms it's really you before we show account data.</p>
  </div>
</section>
{% endblock %}
