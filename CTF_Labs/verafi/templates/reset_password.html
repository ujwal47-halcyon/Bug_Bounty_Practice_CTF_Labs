{% extends "base.html" %}
{% block content %}
<section class="wrap">
  <div class="panel">
    <h1>Set a new password</h1>
    {% if done %}
      <div class="success-banner">Your password has been updated for {{ email }}.</div>
      <a class="btn small" style="text-decoration:none; display:inline-block; margin-top:10px;" href="/login">Log in &rarr;</a>
    {% else %}
      {% if error %}<div class="error-banner">{{ error }}</div>{% endif %}
      <p class="sub">Resetting password for: <strong>{{ email or "unknown" }}</strong></p>
      <form method="post">
        <input type="hidden" name="token" value="{{ request.args.get('token', '') }}">
        <div class="field">
          <label for="password">New password</label>
          <input type="password" name="password" id="password" required>
        </div>
        <button class="btn" type="submit">Reset password</button>
      </form>
    {% endif %}
  </div>
</section>
{% endblock %}
