{% extends "base.html" %}

{% block title %}{{ title }} — NexusCloud{% endblock %}

{% block content %}
<div style="max-width: 600px; margin: 3rem auto; text-align: center;" class="card">
    <div style="font-size: 3.5rem; margin-bottom: 1rem;">✅</div>
    <h1 style="font-size: 1.8rem; margin-bottom: 1rem;">{{ title }}</h1>
    <p style="color: var(--text-muted); line-height: 1.6; margin-bottom: 2rem;">{{ message }}</p>

    <div style="display: flex; gap: 1rem; justify-content: center;">
        <a href="/" class="btn-primary" style="display: inline-block; width: auto; padding: 0.75rem 1.5rem; text-decoration: none;">Return Home</a>
        <a href="/admin/login" class="btn-nav" style="padding: 0.75rem 1.5rem; text-decoration: none;">Admin Login (View Submission)</a>
    </div>
</div>
{% endblock %}
