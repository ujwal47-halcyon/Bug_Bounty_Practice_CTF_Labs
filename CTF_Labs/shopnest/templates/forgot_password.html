{% extends "base.html" %}
{% block content %}
<div class="card auth-card p-4 shadow-sm">
  <h4 class="mb-3">Forgot your password?</h4>
  <p class="small text-muted">Enter your username and we'll send you a reset link.</p>
  {% if message %}<div class="alert alert-info small">{{ message }}</div>{% endif %}
  <form method="post">
    <div class="mb-3"><input class="form-control" name="username" placeholder="Username" required></div>
    <button class="btn btn-shopnest w-100">Send reset link</button>
  </form>
</div>
{% endblock %}
