{% extends "base.html" %}
{% block content %}
<div class="card p-4 shadow-sm" style="max-width:500px;">
  <h5>Order #{{ o['id'] }}</h5>
  <p class="text-muted small mb-1">Placed by: {{ o['username'] }}</p>
  <p>{{ o['name'] }} × {{ o['qty'] }}</p>
  <p class="fw-bold">₹{{ "%.0f"|format(o['price'] * o['qty']) }}</p>
  <p class="small text-secondary">Shipping to: {{ o['shipping_address'] }}</p>
  <span class="badge bg-info align-self-start">{{ o['status'] }}</span>
</div>
{% endblock %}
