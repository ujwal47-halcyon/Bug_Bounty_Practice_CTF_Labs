{% extends "base.html" %}
{% block content %}
<div class="card auth-card p-4 shadow-sm">
  <h4 class="mb-3">Log in to ShopNest</h4>
  {% if error %}<div class="alert alert-danger py-2">{{ error }}</div>{% endif %}
  <form method="post" id="loginForm">
    <div class="mb-3">
      <label class="form-label">Username</label>
      <input class="form-control" name="username" required>
    </div>
    <div class="mb-3">
      <label class="form-label">Password</label>
      <input class="form-control" type="password" name="password" required>
    </div>

    <!-- "Cloudflare-style" human check: a checkbox that, when ticked, just
         sets a hidden form field client-side. No server-issued challenge
         token is ever verified. -->
    <div class="border rounded p-2 mb-3 d-flex align-items-center bg-light">
      <input type="checkbox" id="humanCheck" class="form-check-input me-2" onchange="document.getElementById('captchaVerified').value = this.checked ? 'true' : '';">
      <label for="humanCheck" class="form-check-label mb-0">I'm not a robot</label>
      <i class="bi bi-shield-check ms-auto text-secondary"></i>
    </div>
    <input type="hidden" name="captcha_verified" id="captchaVerified" value="">

    <button class="btn btn-shopnest w-100">Log in</button>
  </form>
  <div class="text-center mt-3 small">
    <a href="{{ url_for('forgot_password') }}">Forgot password?</a> ·
    <a href="{{ url_for('register') }}">Create an account</a>
  </div>
  <div class="text-center mt-2 small text-muted">
    Lab accounts: admin/Admin@123 · alice/Alice@123 · bob/Bob@123 · charlie/Charlie@123 (2FA) · victim/Victim@2024
  </div>
</div>
{% endblock %}
