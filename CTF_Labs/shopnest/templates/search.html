{% extends "base.html" %}
{% block content %}
<!-- q is rendered with |safe below: reflected XSS -->
<h4>Search results for: {{ q|safe }}</h4>
<div class="row g-4 mt-1">
  {% for p in results %}
  <div class="col-6 col-md-4 col-lg-3">
    <div class="card product-card h-100">
      <a href="{{ url_for('product', pid=p['id']) }}" class="text-decoration-none text-dark">
        <div class="product-thumb"><i class="bi bi-box-seam"></i></div>
        <div class="card-body">
          <div class="fw-semibold">{{ p['name'] }}</div>
          <div class="price-tag">₹{{ "%.0f"|format(p['price']) }}</div>
        </div>
      </a>
    </div>
  </div>
  {% else %}
  <p class="text-muted">No products matched your search.</p>
  {% endfor %}
</div>
{% endblock %}
