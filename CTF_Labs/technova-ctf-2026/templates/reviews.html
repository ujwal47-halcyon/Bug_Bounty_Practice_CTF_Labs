{% extends "base.html" %}

{% block title %}Reviews - TechNova{% endblock %}

{% block extra_styles %}
<style>
    .reviews-hero {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        padding: 4rem 2rem;
        text-align: center;
        color: white;
    }

    .reviews-hero h1 {
        font-size: 3rem;
        font-weight: 800;
        margin-bottom: 1rem;
    }

    .reviews-hero p {
        font-size: 1.2rem;
        opacity: 0.9;
    }

    .review-form-section {
        margin: 3rem 0;
    }

    .review-form {
        background: white;
        border-radius: 16px;
        padding: 2.5rem;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        max-width: 800px;
        margin: 0 auto;
    }

    .review-form h2 {
        font-size: 2rem;
        margin-bottom: 2rem;
        color: var(--dark);
    }

    .form-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 1.5rem;
    }

    @media (max-width: 768px) {
        .reviews-hero h1 {
            font-size: 2rem;
        }

        .form-row {
            grid-template-columns: 1fr;
        }
    }
</style>
{% endblock %}

{% block content %}
<div class="reviews-hero">
    <h1>Customer Reviews</h1>
    <p>Share your experience with TechNova products</p>
</div>

<div class="container">
    <div class="review-form-section">
        <div class="review-form">
            <h2>Write a Review</h2>
            <form method="POST" action="/reviews/submit">
                <div class="form-row">
                    <div class="form-group">
                        <label>Your Name *</label>
                        <input type="text" name="name" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label>Email Address *</label>
                        <input type="email" name="email" class="form-control" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Product *</label>
                        <select name="product" class="form-control" required>
                            <option value="">Select a product</option>
                            <option value="Smart Home Hub Pro">Smart Home Hub Pro</option>
                            <option value="AI Assistant Plus">AI Assistant Plus</option>
                            <option value="Security 360 System">Security 360 System</option>
                            <option value="Energy Saver Pro">Energy Saver Pro</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Rating *</label>
                        <select name="rating" class="form-control" required>
                            <option value="5">⭐⭐⭐⭐⭐ Excellent</option>
                            <option value="4">⭐⭐⭐⭐ Good</option>
                            <option value="3">⭐⭐⭐ Average</option>
                            <option value="2">⭐⭐ Poor</option>
                            <option value="1">⭐ Terrible</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label>Review Title *</label>
                    <input type="text" name="title" class="form-control" placeholder="Summarize your experience" required>
                </div>

                <div class="form-group">
                    <label>Your Review *</label>
                    <textarea name="review" class="form-control" rows="6" placeholder="Tell us about your experience with this product..." required></textarea>
                </div>

                <button type="submit" class="btn-primary">Submit Review</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
